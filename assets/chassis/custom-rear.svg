<title id="title">X570D4U-2L2T custom NAS rear panel</title>
<desc id="desc">Rear view. LAN2 above LAN1 (Intel i210); LAN4 above LAN3 (Intel X550). Separate IPMI port. Four empty half-height PCIe slots, two 90 mm fans and PSU opening. Adapter mapping not yet verified.</desc>
