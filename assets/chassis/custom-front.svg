<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="front-title front-desc">
<title id="front-title">Custom eight-bay NAS front panel</title>
<desc id="front-desc">Front view based on supplied chassis photograph. Power and reset buttons, two vertically oriented USB sockets, eight physical drive trays from left to right. No verified QTS disk or USB mapping; all states unknown.</desc>
